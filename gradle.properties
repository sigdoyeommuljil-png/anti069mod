# ==========================================================================
# [역할] 빌드에 쓰는 버전 값들을 모아둔 곳. build.gradle 이 이 값들을 참조합니다.
# 아래 3개(yarn/loader/fabric-api 버전)는 정확한 최신값을
# https://fabricmc.net/develop  (버전 생성기)에서 26.2 로 선택해 확인 후 채우세요.
# 26.2 는 2026년 6월 릴리스라 빌드번호가 자주 바뀝니다.
# ==========================================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 마인크래프트 / 매핑 / 로더
minecraft_version=26.2
yarn_mappings=26.2+build.1
loader_version=0.19.3

# Fabric API (블로그 기준 0.152.x 대 사용)
fabric_version=0.152.0+26.2

# 모드 정보
mod_version=1.0.0
maven_group=com.anti069
archives_base_name=anti069mod
